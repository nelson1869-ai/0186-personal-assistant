[package]
name = "assistant-desktop"
version = "0.1.0"
description = "0186 Personal Assistant desktop shell"
authors = ["0186 contributors"]
edition = "2021"

[lib]
name = "assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
